<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#17212b}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dbe3ec;padding:14px}
.wrap{max-width:1450px;margin:auto}.title{font-size:24px;font-weight:800;color:#0b4f8a}.sub{font-size:13px;color:#667482;margin-top:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tools input,.tools select,.tools button,.btn{border:1px solid #bdc9d6;border-radius:9px;background:#fff;padding:10px 12px;font-size:14px}
.tools input{flex:1;min-width:220px}.tools button,.btn{cursor:pointer;font-weight:700}.primary{background:#0b67b2!important;color:#fff!important;border-color:#0b67b2!important}
main{max-width:1450px;margin:16px auto;padding:0 14px}.progress{background:#fff;border:2px solid #1976d2;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.progressTop{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:800}.pct{font-size:21px;color:#0b5cad}.bar{height:11px;background:#e4eaf0;border-radius:99px;overflow:hidden;margin:9px 0 5px}.fill{height:100%;width:0;background:#1976d2}
.small{font-size:12px;color:#65717d}.count{margin:10px 0;font-size:13px;color:#53606d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px}
.card{background:#fff;border:1px solid #dce4ec;border-radius:13px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 2px 7px rgba(0,0,0,.04)}
.photo{aspect-ratio:4/3;background:#edf2f6;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;color:#7c8995;font-weight:700}.placeholder small{display:block;font-weight:400;margin-top:6px}
.body{padding:11px;display:flex;flex-direction:column;flex:1}.name{font-weight:800;overflow-wrap:anywhere}.cat{font-size:12px;color:#687581;margin:4px 0 10px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:auto}.actions button{min-width:0;width:100%;border:1px solid #c5d0db;background:#fff;border-radius:8px;padding:8px 5px;font-weight:700;cursor:pointer;white-space:normal}.actions button:last-child:nth-child(odd){grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);align-items:center;justify-content:center;padding:15px}.panel{background:#fff;width:min(680px,96vw);max-height:92vh;overflow:auto;border-radius:15px;padding:20px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.formgrid input,.formgrid select,.formgrid textarea{width:100%;padding:10px;border:1px solid #bdc9d6;border-radius:8px}.formgrid textarea{min-height:90px}.modalActions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}.modalActions button{padding:9px 12px;border:1px solid #bdc9d6;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}
#lightbox img{max-width:94vw;max-height:88vh;object-fit:contain}.closeLight{position:fixed;right:22px;top:15px;color:#fff;font-size:38px;cursor:pointer}
@media(max-width:600px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}.actions button:last-child:nth-child(odd){grid-column:auto}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>

const KEY="phototheque_atelier_v16";
let data=CATALOG.map(x=>({...x})),targetId=null,editingRemovePhoto=false;
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const initialCats=[...new Set(CATALOG.map(x=>x.category))];
function cats(){return [...new Set(data.map(x=>x.category).filter(Boolean))].sort((a,b)=>{let ia=initialCats.indexOf(a),ib=initialCats.indexOf(b);if(ia<0)ia=999;if(ib<0)ib=999;return ia-ib||a.localeCompare(b,"fr")})}
function sortCards(a){return [...a].sort((x,y)=>{let cx=cats().indexOf(x.category),cy=cats().indexOf(y.category);return cx-cy||String(x.name).localeCompare(String(y.name),"fr",{numeric:true,sensitivity:"base"})})}
function safeSave(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function updateSelectors(keep=true){const old=keep?$("#cat").value:"";$("#cat").innerHTML='<option value="">Toutes les catégories</option>'+cats().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");if(cats().includes(old))$("#cat").value=old}
function updateProgress(){let total=data.length,filled=data.filter(x=>x.image).length,pct=total?Math.round(filled*100/total):0;$("#photoCount").textContent=`${filled} photo${filled>1?"s":""} présente${filled>1?"s":""} / ${total} carte${total>1?"s":""}`;$("#photoPct").textContent=pct+" %";$("#progressFill").style.width=pct+"%";let r=total-filled;$("#remaining").textContent=r?`${r} photo${r>1?"s":""} encore à ajouter`:"Photothèque complète"}
function render(){updateSelectors();updateProgress();let q=norm($("#q").value),c=$("#cat").value;let list=sortCards(data.filter(x=>(!c||x.category===c)&&(!q||norm([x.name,x.category,x.vehicle,x.keywords,x.notes].join(" ")).includes(q))));$("#shown").textContent=list.length;$("#grid").innerHTML=list.map(p=>`<article class="card"><div class="photo" data-photo="${esc(p.id)}">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:`<div class="placeholder">Aucune photo<small>Cliquer ou déposer une image</small></div>`}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="cat">${esc(p.category)}</div><div class="actions"><button data-pick="${esc(p.id)}">Choisir photo</button><button data-edit="${esc(p.id)}">Modifier</button><button data-dup="${esc(p.id)}">Dupliquer</button>${p.image?`<button data-rm="${esc(p.id)}">Retirer photo</button>`:""}</div></div></article>`).join("");bindCards()}
function find(id){return data.find(x=>String(x.id)===String(id))}
function imageTo43(file){return new Promise((resolve,reject)=>{let fr=new FileReader();fr.onerror=reject;fr.onload=()=>{let im=new Image();im.onerror=reject;im.onload=()=>{let W=1200,H=900,sc=Math.max(W/im.width,H/im.height),sw=W/sc,sh=H/sc,sx=(im.width-sw)/2,sy=(im.height-sh)/2,cv=document.createElement("canvas");cv.width=W;cv.height=H;cv.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,W,H);resolve(cv.toDataURL("image/jpeg",.88))};im.src=fr.result};fr.readAsDataURL(file)})}
async function setImage(id,file){let p=find(id);if(!p)return;p.image=await imageTo43(file);safeSave();render()}
function bindCards(){document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{targetId=b.dataset.pick;$("#picker").click()});document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>duplicate(b.dataset.dup));document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{let p=find(b.dataset.rm);if(p&&confirm("Retirer cette photo ?")){p.image="";safeSave();render()}});document.querySelectorAll("[data-photo]").forEach(z=>{z.onclick=e=>{let p=find(z.dataset.photo);if(p?.image&&e.target.tagName==="IMG"){openLight(p.image)}else{targetId=z.dataset.photo;$("#picker").click()}};z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();let f=[...e.dataTransfer.files].find(x=>x.type.startsWith("image/"));if(f)setImage(z.dataset.photo,f)}})}
function fillFormCats(current=""){let cs=cats();$("#fCategory").innerHTML=cs.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")+'<option value="__NEW__">+ Créer une nouvelle catégorie…</option>';if(cs.includes(current))$("#fCategory").value=current}
function openForm(id=null){editingRemovePhoto=false;let p=id?find(id):null;$("#modalTitle").textContent=p?"Modifier la carte":"Créer une nouvelle carte";$("#cardId").value=p?String(p.id):"";$("#fName").value=p?.name||"";fillFormCats(p?.category||cats()[0]||"");$("#fVehicle").value=p?.vehicle||"";$("#fKeywords").value=p?.keywords||"";$("#fNotes").value=p?.notes||"";$("#fPhoto").value="";$("#fNewCategory").value="";$("#newCatWrap").style.display="none";$("#removePhoto").style.display=p?.image?"inline-block":"none";$("#cardModal").style.display="flex"}
function closeForm(){$("#cardModal").style.display="none"}
async function saveForm(){let name=$("#fName").value.trim();if(!name)return alert("Indiquez le nom de la pièce.");let category=$("#fCategory").value;if(category==="__NEW__"){category=$("#fNewCategory").value.trim();if(!category)return alert("Indiquez la nouvelle catégorie.")}let id=$("#cardId").value,p=id?find(id):null;if(!p){p={id:"custom_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),image:"",custom:true};data.push(p)}p.name=name;p.category=category||"Autres";p.vehicle=$("#fVehicle").value.trim();p.keywords=$("#fKeywords").value.trim();p.notes=$("#fNotes").value.trim();if(editingRemovePhoto)p.image="";let f=$("#fPhoto").files[0];if(f)p.image=await imageTo43(f);safeSave();updateSelectors(false);$("#cat").value=p.category;$("#q").value="";closeForm();render()}
function duplicate(id){let p=find(id);if(!p)return;let base=String(p.name).replace(/\s*[—-]\s*Variante\s+\d+\s*$/i,""),n=2;while(data.some(x=>x.category===p.category&&x.name===`${base} — Variante ${n}`))n++;data.push({...p,id:"custom_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),name:`${base} — Variante ${n}`,image:"",custom:true,duplicatedFrom:p.id});safeSave();updateSelectors(false);$("#cat").value=p.category;$("#q").value="";render()}
function normalizeLibrary(o){if(Array.isArray(o))return o;if(o&&Array.isArray(o.photos))return o.photos;if(o&&Array.isArray(o.data))return o.data;throw new Error("Format non reconnu")}
async function openText(txt,name=""){let o=JSON.parse(String(txt).replace(/^\uFEFF/,""));let arr=normalizeLibrary(o);data=arr.map((x,i)=>({...x,id:x.id??("import_"+Date.now()+"_"+i)}));safeSave();updateSelectors(false);$("#q").value="";$("#cat").value="";render();document.title="Photothèque Atelier V17"+(name?" — "+name:"")}
function openLight(src){$("#lightImg").src=src;$("#lightbox").style.display="flex"}function closeLight(){$("#lightbox").style.display="none";$("#lightImg").src=""}
$("#q").oninput=render;$("#cat").onchange=render;$("#newCard").onclick=()=>openForm();$("#cancelCard").onclick=closeForm;$("#saveCard").onclick=saveForm;$("#fCategory").onchange=()=>$("#newCatWrap").style.display=$("#fCategory").value==="__NEW__"?"block":"none";$("#removePhoto").onclick=()=>{editingRemovePhoto=true;$("#removePhoto").textContent="Photo à retirer"};$("#picker").onchange=e=>{let f=e.target.files[0];if(f&&targetId!=null)setImage(targetId,f);e.target.value=""};$("#import").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{await openText(await f.text(),f.name)}catch(err){alert("Impossible d’ouvrir ce fichier .photo.\n\n"+err.message)}finally{e.target.value=""}};$("#export").onclick=()=>{let blob=new Blob([JSON.stringify({format:"Phototheque Atelier",version:5,photos:data},null,2)],{type:"application/octet-stream"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Phototheque_Atelier.photo";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$(".closeLight").onclick=closeLight;$("#lightbox").onclick=e=>{if(e.target.id==="lightbox")closeLight()};
async function autoOpen(){let u=new URL(location.href),x=u.searchParams.get("open");if(!x)return;try{let r=await fetch(x,{cache:"no-store"});if(!r.ok)throw new Error("Lecture impossible");await openText(await r.text(),u.searchParams.get("name")||"")}catch(e){alert("Ouverture automatique impossible : "+e.message)}}
try{let saved=JSON.parse(localStorage.getItem(KEY)||"null");if(Array.isArray(saved)&&saved.length)data=saved}catch(e){}
updateSelectors(false);render();setTimeout(autoOpen,100);
</script>
